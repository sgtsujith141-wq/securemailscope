[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securemailscope"
version = "0.1.0"
description = "Passive cryptographic security posture assessment for captured email traffic (SIH26159)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "SecureMailScope Team" }]
keywords = ["pcap", "forensics", "smtp", "imap", "pop3", "tls", "passive-analysis"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
  "Private :: Do Not Upload",
]

# Runtime dependencies for the M0/M1 forensic engine only.
# Backend (FastAPI), ML (scikit-learn) and certificate parsing (cryptography)
# are declared as optional extras so the engine stays installable and testable
# on its own -- see docs/adr/0001-engine-independent-of-web-stack.md.
dependencies = [
  "scapy==2.6.1",
  "pydantic==2.9.2",
  # X.509 parsing and the RFC 5280 verification API (M3). The TLS record and
  # handshake layers do not need it; certificates/ degrades to NOT_AVAILABLE
  # if it is missing, so the engine still runs without it.
  "cryptography==43.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.7.4",
  "mypy==1.13.0",
]
# Declared, NOT used yet. Present so the dependency surface of later
# milestones is visible and pinned up front.
backend = [
  "fastapi==0.115.5",
  "uvicorn==0.32.1",
]
ml = [
  "scikit-learn==1.5.2",
  "numpy==2.1.3",
]

[project.scripts]
securemailscope = "securemailscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["securemailscope*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end tests that execute the installed CLI",
]
filterwarnings = ["error::DeprecationWarning:securemailscope.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
  "S101",  # assert is the expected idiom in pytest
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The TLS code-point table is a transcription of an IANA registry. Keeping one
# entry per line, aligned, makes it checkable against the source; wrapping it
# would make review harder, not easier.
"src/securemailscope/tls/registry.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/securemailscope"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
