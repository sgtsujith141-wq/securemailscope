[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securemailscope"
version = "0.1.0"
description = "Passive cryptographic security posture assessment for captured email traffic (SIH26159)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "SecureMailScope Team" }]
keywords = ["pcap", "forensics", "smtp", "imap", "pop3", "tls", "passive-analysis"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
  "Private :: Do Not Upload",
]

# Runtime dependencies for the M0/M1 forensic engine only.
# Backend (FastAPI), ML (scikit-learn) and certificate parsing (cryptography)
# are declared as optional extras so the engine stays installable and testable
# on its own -- see docs/adr/0001-engine-independent-of-web-stack.md.
dependencies = [
  "scapy==2.7.0",
  "pydantic==2.9.2",
  # X.509 parsing and the RFC 5280 verification API (M3). The TLS record and
  # handshake layers do not need it; certificates/ degrades to NOT_AVAILABLE
  # if it is missing, so the engine still runs without it.
  "cryptography==50.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.7.4",
  "mypy==1.13.0",
  # Property-based testing for the malformed-input suite (M8). Generating the
  # awkward cases is the point: a fixed list of hand-written bad inputs only
  # ever finds the bugs its author already imagined.
  "hypothesis==6.119.4",
]
backend = [
  "fastapi==0.141.1",
  # Declared explicitly because backend/app.py imports it directly, to
  # register a handler for the base HTTPException the router itself raises.
  # A FastAPI-only handler would not catch a routing 404. Relying on it as a
  # transitive of FastAPI would work until FastAPI changed its own floor.
  "starlette==1.6.0",
  "uvicorn==0.32.1",
  "sqlalchemy==2.0.36",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "reportlab==4.2.5",
]
# Verifying a generated PDF: text extraction and page rasterisation. Only the
# test suite needs these; the application renders without them.
reporting-tests = [
  "pypdf==6.19.0",
  "pypdfium2==4.30.0",
  "httpx==0.27.2",
]
ml = [
  "scikit-learn==1.5.2",
  "numpy==2.1.3",
  # ml/registry.py imports joblib directly to load and save model artifacts,
  # so it is declared rather than taken transitively from scikit-learn.
  "joblib==1.6.0",
]

[project.scripts]
securemailscope = "securemailscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["securemailscope*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end tests that execute the installed CLI",
]
filterwarnings = ["error::DeprecationWarning:securemailscope.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# setuptools copies the package into build/ when a wheel or an editable
# install is made, so `ruff check .` would lint the same files twice -- and
# fail, because the copies are not formatted to this configuration. They are
# build output, not source.
extend-exclude = ["build", "dist", ".venv-engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
  "S101",  # assert is the expected idiom in pytest
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The TLS code-point table is a transcription of an IANA registry. Keeping one
# entry per line, aligned, makes it checkable against the source; wrapping it
# would make review harder, not easier.
"src/securemailscope/tls/registry.py" = ["E501"]
# FastAPI's dependency injection is expressed through call expressions in
# parameter defaults -- Depends(), Query(), File(). That is the framework's
# documented idiom and the only way to declare them, so B008 does not apply.
"src/securemailscope/backend/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
# M9 widened this from src/ alone. Test and script code was previously
# unchecked, which hid 82 genuine type errors -- mostly optional values
# dereferenced without narrowing, where a failure would have surfaced as an
# opaque AttributeError instead of a stated assertion.
files = ["src/securemailscope", "tests", "scripts"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

# Test and script functions are exempt from the annotation requirement only.
# Every other check -- optional narrowing, argument types, attribute access --
# applies to them exactly as it does to the package. Requiring `-> None` on
# several hundred test functions would add noise, not safety; requiring that a
# test not dereference an Optional without asserting it is real safety.
[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
